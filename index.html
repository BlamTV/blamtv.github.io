<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlamTV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600;700&family=Chivo+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #f2f4f6; --surface: #ffffff; --raise: #e7ebef; --line: #d6dce3;
  --fg: #121820; --muted: #5a6776; --accent: #a86d00; --accent-ink: #ffffff;
  --live: #d4192f;
  --display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "Chivo Mono", ui-monospace, Menlo, monospace;
  --r: 10px; --logo-filter: invert(1) brightness(.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1218; --surface: #161c24; --raise: #1f2731; --line: #29333f;
  --fg: #e9eef3; --muted: #8f9cab; --accent: #f3b234; --accent-ink: #14100a;
  --live: #ff4d5e; --logo-filter: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #161c24; --raise: #1f2731; --line: #29333f;
  --fg: #e9eef3; --muted: #8f9cab; --accent: #f3b234; --accent-ink: #14100a;
  --live: #ff4d5e; --logo-filter: none; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); }
header.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap }
.logo { display: flex; align-items: center; gap: 12px }
.logo .seal { height: 56px; width: 56px; flex: 0 0 auto; color: var(--fg) }
.logo .words { display: grid; gap: 4px }
.logo b { font: 800 24px/1 var(--display); letter-spacing: -.01em; text-transform: uppercase }
.logo b span { background: var(--accent); color: var(--accent-ink); padding: 0 5px 1px; margin-left: 3px; border-radius: 3px }
.logo small { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.logo small.stats { font-size: 10.5px; letter-spacing: .1em; display: flex; gap: 10px; flex-wrap: wrap }
.logo small.stats b { font: 800 11px/1 var(--body); letter-spacing: .04em; text-transform: none; color: var(--accent); margin: 0 3px 0 0; padding: 0; background: none }
nav.tabs { display: flex; gap: 4px; margin-left: auto }
nav.tabs a { font: 700 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 10px 14px; border-radius: 999px; color: var(--accent) }
nav.tabs a:hover { color: var(--accent); background: var(--raise) }
nav.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--accent) }
nav.tabs a { position: relative }
nav.tabs a.hot { box-shadow: 0 0 0 1.5px var(--live), 0 0 14px color-mix(in srgb, var(--live) 60%, transparent); animation: streetz 1.6s ease-in-out infinite }
@keyframes streetz { 50% { box-shadow: 0 0 0 1.5px var(--live), 0 0 3px transparent } }
@media (prefers-reduced-motion: reduce) { nav.tabs a.hot { animation: none } }
nav.tabs a .streetz { position: absolute; left: 50%; top: calc(100% + 3px); transform: translateX(-50%); font: 800 8.5px/1 var(--body); letter-spacing: .05em; text-transform: none; background: var(--live); color: #fff; padding: 3px 6px; border-radius: 999px; white-space: nowrap; pointer-events: none; z-index: 6 }
.hash { height: 8px; background:
  repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 24px) bottom / 100% 6px no-repeat,
  linear-gradient(var(--line), var(--line)) bottom / 100% 1px no-repeat; }

main { padding-block: 22px 48px; min-height: 60vh }

.banner { background: var(--raise); border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 14px; color: var(--muted); margin-bottom: 18px }
.banner strong { color: var(--fg) }

.live { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 22px }
.live a { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); max-width: 340px }
.live a:hover { border-color: var(--live) }
.live .txt { min-width: 0 }
.live .txt b { display: block; font-size: 14px }
.live .txt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pill-live { font: 700 11px/1 var(--body); letter-spacing: .1em; color: #fff; background: var(--live); padding: 4px 6px; border-radius: 4px }

.weekhead { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px }
.weekhead h1 { font: 800 clamp(34px, 6vw, 54px)/1 var(--display); text-transform: uppercase; margin: 0; letter-spacing: -.01em; text-wrap: balance }
.weekhead p { margin: 6px 0 0; color: var(--muted); font-weight: 500 }
.weekhead .count { font: 500 13px/1 var(--mono); color: var(--muted) }
.sched { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; margin-bottom: 22px; scrollbar-width: thin }
.sched a { flex: 0 0 auto; display: grid; justify-items: center; gap: 2px; min-width: 58px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface) }
.sched a b { font: 800 20px/1 var(--display) }
.sched a small { font: 600 10px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.sched a i { font: 500 11px/1 var(--mono); font-style: normal; color: var(--muted) }
.sched a:hover { border-color: var(--muted) }
.sched a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.sched a[aria-current="page"] small, .sched a[aria-current="page"] i { color: var(--accent-ink) }
.sched a.empty { opacity: .55 }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 26px 18px }
.card { display: grid; gap: 10px; min-width: 0 }
.thumb { position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--raise) }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s }
.card:hover .thumb img { transform: scale(1.03) }
.ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink);
  background: linear-gradient(135deg, var(--sc) 0 55%, color-mix(in srgb, var(--sc) 70%, #000) 55%); }
.ph::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 11.5%, rgba(255,255,255,.12) 11.5% 12%) }
.ph-abbr { font: 800 clamp(30px, 7vw, 46px)/1 var(--display); letter-spacing: -.01em; z-index: 1 }
.ph-wk { position: absolute; left: 10px; top: 10px; font: 700 11px/1 var(--body); letter-spacing: .12em; z-index: 1; opacity: .9 }
.dur, .tag { position: absolute; bottom: 8px; font: 500 12px/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: rgba(8,10,14,.82); color: #fff; z-index: 2 }
.sides { position: absolute; top: 8px; right: 8px; z-index: 2; font: 700 10px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 7px; border-radius: 4px; background: rgba(8,10,14,.82); color: #fff }
.dur { right: 8px } .tag { left: 8px; background: var(--accent); color: var(--accent-ink); font-family: var(--body); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 10px }
.meta { display: flex; gap: 10px; align-items: flex-start }
.meta .txt { min-width: 0 }
.meta h3 { margin: 0 0 4px; font: 700 16px/1.3 var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere }
.meta p { margin: 0; font-size: 14px; color: var(--muted) }
.av { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--sc); color: var(--ink); font: 800 10px/1 var(--display); letter-spacing: -.02em; box-shadow: 0 0 0 2px var(--sc) }
.av img { width: 100%; height: 100%; object-fit: cover }
.av.lg { width: 84px; height: 84px; font-size: 22px; box-shadow: 0 0 0 3px var(--sc) }
.av.md { width: 56px; height: 56px; font-size: 14px }

.empty-state { border: 1px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; color: var(--muted) }
.empty-state b { display: block; color: var(--fg); font: 800 22px/1.2 var(--display); text-transform: uppercase; margin-bottom: 6px }

.toolbar { display: flex; gap: 12px; align-items: end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px }
.toolbar h1 { font: 800 clamp(34px, 6vw, 54px)/1 var(--display); letter-spacing: -.01em; text-transform: uppercase; margin: 0 }
.search { width: min(100%, 300px); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 14px }
.ch { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--sc); min-width: 0 }
.ch:hover { border-color: var(--muted); border-left-color: var(--sc) }
.ch .txt { min-width: 0 }
.ch b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ch span { display: block; font-size: 14px; color: var(--muted) }
.ch .n { font: 500 12px/1 var(--mono); margin-top: 4px }
.ch .av, .byline .who .av { display: grid; color: var(--ink) }
.byline .who .av { font-size: 10px }

.chan { position: relative; border-radius: calc(var(--r) + 4px); overflow: hidden; margin-bottom: 26px; background: var(--surface); border: 1px solid var(--line) }
.ch-intro { max-width: 860px; margin: -10px 0 26px; border-radius: calc(var(--r) + 4px); overflow: hidden; background: #000; border: 1px solid var(--line) }
.ch-intro video { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 72vh; background: #000; object-fit: contain }
.ch-intro .cap { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); font-weight: 700; font-size: 15px }
.ch-intro .cap span { flex: none; white-space: nowrap; font: 800 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; background: #f3b234; color: #111; padding: 5px 7px; border-radius: 4px }
.chan .band { height: 92px; background: linear-gradient(120deg, var(--sc), color-mix(in srgb, var(--sc) 60%, #000)); position: relative }
.chan .band::after { content: attr(data-abbr); position: absolute; right: 18px; bottom: -10px; font: 800 76px/1 var(--display); color: var(--ink); opacity: .22 }
.chan .body { display: flex; gap: 16px; align-items: flex-end; padding: 0 18px 18px; margin-top: -42px; flex-wrap: wrap; position: relative }
.chan h1 { margin: 0; font: 800 clamp(26px, 5vw, 42px)/1.05 var(--display); letter-spacing: -.01em; text-transform: uppercase; overflow-wrap: anywhere }
.chan p { margin: 4px 0 0; color: var(--muted) }
.chan .txt { min-width: 0; flex: 1 1 220px }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--raise); font-weight: 700; font-size: 14px; border: 1px solid var(--line) }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.section-h { font: 800 21px/1.1 var(--display); text-transform: uppercase; margin: 30px 0 14px; display: flex; align-items: center; gap: 12px }
.section-h::after { content: ""; flex: 1; height: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 18px) }

.watch { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px }
@media (max-width: 1000px) { .watch { grid-template-columns: minmax(0, 1fr) } }
.player { aspect-ratio: 16/9; max-width: 100%; border-radius: var(--r); overflow: hidden; background: #000; position: relative }
.player iframe, .player video { width: 100%; height: 100%; border: 0; display: block; background: #000 }
.player .ph { border-radius: 0 }
.player.vert { aspect-ratio: 9/16; width: min(100%, 400px); margin-inline: auto }
.player .note { position: absolute; z-index: 3; left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(8,10,14,.86); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis }
.watch h1 { font: 700 22px/1.25 var(--body); margin: 14px 0 10px; overflow-wrap: anywhere }
.byline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.byline .who { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0 }
.byline .who b { display: block }
.byline .who span { display: block; font-size: 13px; color: var(--muted) }
.other { margin-top: 14px; border: 1px solid var(--accent); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; background: var(--surface) }
.other h2 { margin: 0; font: 800 15px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; color: var(--accent) }
.other a { display: flex; align-items: center; gap: 12px; min-width: 0 }
.other a .t { min-width: 0; flex: 1 }
.other a b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.other a span.s { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.other .go { flex: 0 0 auto; font-weight: 700; font-size: 14px; color: var(--accent) }
.other .av { display: grid; color: var(--ink) }
.other .bothbtn { justify-content: center; font-weight: 700; font-size: 14px; padding: 9px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink) }
.both-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
.both-head h1 { margin: 0; font: 800 clamp(26px, 5vw, 44px)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em }
.both-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.both-tools { display: flex; gap: 8px; flex-wrap: wrap }
.both-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
@media (max-width: 900px) { .both-grid { grid-template-columns: 1fr } }
.bside { min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; border-top: 4px solid var(--sc) }
.bside .pl { aspect-ratio: 16/9; background: #000; position: relative }
.bside .pl > div, .bside .pl iframe { position: absolute; inset: 0; width: 100%; height: 100% }
.bside .pl iframe { border: 0 }
.bside .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0 }
.bside .bar .av { display: grid; color: var(--ink) }
.bside .bar .t { flex: 1; min-width: 0 }
.bside .bar b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bside .bar span.s { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bside .snd { flex: 0 0 auto; font: 700 13px/1 var(--body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); cursor: pointer }
.bside .snd[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.both-note { margin-top: 12px; color: var(--muted); font-size: 13px }
.chat { display: grid; gap: 8px; margin-bottom: 22px }
.chat-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.chat-head b { font: 800 19px/1.1 var(--display); text-transform: uppercase }
.chat-tabs { display: flex; gap: 6px; flex-wrap: wrap }
.chat-tabs button { font: 700 12px/1 var(--body); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer }
.chat-tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.chat iframe { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: block }
.chat-note { margin: 0; font-size: 12.5px; color: var(--muted) }
.both-chat { margin-top: 18px }
.both-chat iframe { height: 440px }
.both-tools button { font: 700 14px/1 var(--body); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer }
.both-tools button:disabled { opacity: .5; cursor: default }
.game .both-link { grid-column: 1 / -1; justify-self: center; font: 700 12px/1 var(--body); color: var(--accent); padding: 2px 8px 6px }
.game .both-link:hover { text-decoration: underline }
.mu-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 10px; margin-bottom: 8px }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; padding: 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line) }
.game .at { font: 800 14px/1 var(--display); color: var(--muted) }
.tm { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px; border-radius: 8px }
a.tm:hover { background: var(--raise) }
.tm .av { display: grid; color: var(--ink) }
.tm .nm { min-width: 0; flex: 1 }
.tm .nm b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tm .nm span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tm .play { flex: 0 0 auto; font: 700 11px/1 var(--body); padding: 5px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink) }
.tm .nos { flex: 0 0 auto; font-size: 11px; color: var(--muted) }
.tm.on { background: color-mix(in srgb, var(--live) 10%, transparent); box-shadow: inset 0 0 0 1.5px var(--live) }
.tm.on .av, .ch.on .av { box-shadow: 0 0 0 2px var(--live) }
.game .both-link.live { color: var(--live) }
.ch.on { border-color: var(--live); border-left-color: var(--sc); box-shadow: inset 0 0 0 1px var(--live) }
.ch .pill-live { display: inline-block; margin-left: 6px; vertical-align: 1px; font-size: 10px; padding: 3px 5px }
.tm .chip { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); color: var(--muted); font: 800 10px/1 var(--display); border: 1px dashed var(--muted) }
@media (max-width: 560px) { .tm .play .w, .tm .nos { display: none } .tm .nm b { font-size: 13px } }
.gotw { position: relative; overflow: hidden; isolation: isolate; border-radius: calc(var(--r) + 6px); margin: 0 0 26px; color: #fff;
  background: linear-gradient(105deg, var(--ca) 0 47%, #0b0e13 47% 53%, var(--ch) 53% 100%); border: 1px solid var(--line) }
.gotw::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(90% 120% at 50% 0%, rgba(255,255,255,.14), transparent 60%), linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.45)) }
.gotw .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 18px 0 }
.gotw .gw-tag { font: 800 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; background: #f3b234; color: #14100a; padding: 7px 10px; border-radius: 4px }
.gotw .when { font: 700 14px/1.2 var(--body); text-shadow: 0 1px 2px rgba(0,0,0,.6) }
.gotw .when small { display: block; font-weight: 600; font-size: 12px; opacity: .85; text-align: right }
.gotw .row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 18px 18px 8px }
.gotw .side { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; min-width: 0 }
.gotw .side .av { width: 88px; height: 88px; display: grid; color: var(--ink); font-size: 22px; border: 3px solid rgba(255,255,255,.9); box-shadow: 0 8px 24px rgba(0,0,0,.45) }
.gotw .side b { font: 800 clamp(20px, 4vw, 32px)/1 var(--display); text-transform: uppercase; letter-spacing: -.01em; text-shadow: 0 2px 8px rgba(0,0,0,.5); overflow-wrap: anywhere }
.gotw .side span { font-size: 13px; opacity: .9 }
.gotw .vs { font: 800 clamp(22px, 4vw, 34px)/1 var(--display); color: #f3b234; text-shadow: 0 2px 10px rgba(0,0,0,.6) }
.gotw .clock { text-align: center; padding: 4px 18px 0; font: 700 15px/1.3 var(--body); text-shadow: 0 1px 3px rgba(0,0,0,.6) }
.gotw .clock .n { font: 800 22px/1 var(--display); letter-spacing: .02em }
.gotw .acts { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 14px 18px 18px }
.gotw .acts a { display: inline-flex; align-items: center; gap: 8px; font: 700 14px/1 var(--body); padding: 10px 14px; border-radius: 999px; background: rgba(8,10,14,.72); color: #fff; border: 1px solid rgba(255,255,255,.35) }
.gotw .acts a:hover { background: rgba(8,10,14,.92); border-color: #fff }

.pf-g .both-link { display: block; text-align: center; font: 700 12px/1 var(--body); color: var(--accent); padding: 0 8px 8px }

.pf-key { font-size: 13px; color: var(--muted); margin: -14px 0 26px }
.mg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px }

.mg-card:hover { border-color: var(--accent) }
.mg-card small { font: 800 11px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent) }
.mg-card b { font: 800 19px/1.1 var(--display); text-transform: uppercase }
.mg-card span { color: var(--muted); font-size: 14px }
@media (max-width: 700px) { .mg-bk { grid-template-columns: 1fr } .mg-top span:last-child { display: none } .mg-top { justify-content: center } }
/* Video banners for Weeks (stadium) and Channels (coach). Hidden until the video loads; removed if it can't. */
.vb-hero { position: relative; overflow: hidden; border-radius: calc(var(--r) + 6px); margin: 4px 0 18px; height: clamp(170px, 28vw, 320px); background: #07080b; color: #fff; display: none }
.vb-hero.has-vid { display: block }
.vb-hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--vb-pos, 50% 50%) }
.vb-hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(5,6,9,.82) 0%, rgba(5,6,9,.45) 38%, rgba(5,6,9,0) 64%), linear-gradient(0deg, rgba(5,6,9,.55) 0%, rgba(5,6,9,0) 45%) }
.vb-hero::after { content: ""; position: absolute; inset: auto 0 0 0; z-index: 2; height: 5px; background: repeating-linear-gradient(90deg, #f3b234 0 2px, transparent 2px 18px); opacity: .55 }
.vb-hero .vb-txt { position: absolute; z-index: 2; left: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 30px); max-width: 60% }
.vb-hero .pre { font: 800 clamp(11px, 1.6vw, 14px)/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: #f3c23a; text-shadow: 0 2px 10px rgba(0,0,0,.8) }
.vb-hero h2 { margin: 8px 0 0; font: 800 clamp(30px, 5.6vw, 64px)/.9 var(--display); letter-spacing: -.03em; text-transform: uppercase; text-shadow: 0 3px 0 #6a4a00, 0 2px 18px rgba(0,0,0,.75) }
.vb-hero h2 span { color: #f3c23a }
.vb-hero .sub { margin: 8px 0 0; font: 700 clamp(12px, 1.8vw, 16px)/1.3 var(--body); color: #e8dfc4; text-shadow: 0 2px 10px rgba(0,0,0,.8) }
@media (max-width: 480px) { .vb-hero .vb-txt { max-width: 78% } .vb-hero .sub { display: none } }
.gw-poster { display: block; margin: 0 0 12px; border-radius: calc(var(--r) + 4px); overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,.28) }
.gw-poster img { display: block; width: 100%; height: auto }
</style>

<script>
(() => {
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = login => login.toLowerCase().replace(/_/g, '-');   // Twitch logins never contain hyphens
  let L = null, D = null;
  const members = {}, bySlug = {};

  function inkFor(hex) {
    const n = parseInt(hex.replace('#', ''), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    const lin = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
    const Y = .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b);
    return Y > .4 ? '#111111' : '#ffffff';
  }
  async function getJSON(p) { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }

  function fmtDur(d) {
    if (!d) return '';
    const h = +(d.match(/(\d+)h/) || [0, 0])[1], m = +(d.match(/(\d+)m/) || [0, 0])[1], s = +(d.match(/(\d+)s/) || [0, 0])[1];
    const pad = n => String(n).padStart(2, '0');
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  function ago(iso) {
    if (!iso) return '';
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return 'just now';
    const u = [[31536000, 'year'], [2592000, 'month'], [86400, 'day'], [3600, 'hour'], [60, 'minute']];
    for (const [sec, name] of u) if (s >= sec) { const n = Math.floor(s / sec); return `${n} ${name}${n > 1 ? 's' : ''} ago`; }
  }
  const fmtViews = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K' : String(n ?? 0);
  const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

  function weekLabel(season, week) {
    if (week == null) return 'Unsorted';
    const e = (L.weeks || []).find(w => w.season === season && w.week === week);
    return (e && e.label) || `Week ${week}`;
  }
  const weekShort = v => v.week == null ? '' : (v.season && v.season !== L.season ? `S${v.season} · ` : '') + `WK ${v.week}`;

  function member(login) {
    return members[login] || { login, display: login, school: '', abbr: login.slice(0, 3).toUpperCase(), color: '#555555', ink: '#ffffff', avatar: null, count: 0 };
  }
  const scVars = m => `--sc:${m.color};--ink:${m.ink}`;
  function avatar(m, size = '') {
    return `<span class="av ${size}" style="${scVars(m)}">${m.avatar ? `<img src="${esc(m.avatar)}" alt="" loading="lazy">` : esc(m.abbr)}</span>`;
  }
  function thumb(v, m) {
    const inner = v.thumb
      ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">`
      : `<div class="ph" style="${scVars(m)}"><span class="ph-wk">${esc(weekShort(v))}</span><span class="ph-abbr">${esc(m.abbr)}</span></div>`;
    return `<div class="thumb">${inner}${v.type === 'highlight' ? '<span class="tag">Highlight</span>' : ''}${v.sides && v.sides.length ? '<span class="sides">⇄ Both sides</span>' : ''}<span class="dur">${fmtDur(v.duration)}</span></div>`;
  }
  function card(v, showWeek) {
    const m = member(v.login);
    return `<a class="card" href="#v-${esc(v.id)}">${thumb(v, m)}
      <div class="meta">${avatar(m)}<div class="txt">
        <h3>${esc(v.title)}</h3>
        <p>${esc(m.display)}${m.school ? ' · ' + esc(m.school) : ''}</p>
        <p>${fmtViews(v.views)} views · ${ago(v.created)}${showWeek && v.week != null ? ' · ' + esc(weekLabel(v.season, v.week)) : ''}</p>
      </div></div></a>`;
  }
  const ALIASES = {
    'Alabama': ['Bama', 'Crimson Tide'], 'Auburn': ['War Eagle'], 'Clemson': [], 'Florida': ['Gators', 'UF'],
    'Florida State': ['FSU', 'Seminoles', 'Noles'], 'Georgia': ['UGA', 'Dawgs', 'Bulldogs'], 'Illinois': ['Illini'],
    'Indiana': ['Hoosiers', 'IU'], 'Iowa': ['Hawkeyes'], 'LSU': [], 'Louisville': ['Cardinals', 'Cards'],
    'Maryland': ['Terps', 'Terrapins', 'UMD'], 'Nebraska': ['Huskers', 'Cornhuskers'], 'North Carolina': ['UNC', 'Tar Heels'],
    'Notre Dame': ['ND', 'Irish'], 'Ohio State': ['Buckeyes', 'tOSU'], 'Oklahoma': ['Sooners', 'OU'], 'Ole Miss': ['Rebels'],
    'Oregon': ['Ducks'], 'Penn State': ['PSU', 'Nittany Lions'], 'Pitt': ['Pittsburgh', 'Panthers'], 'South Carolina': ['Gamecocks'],
    'Stanford': ['Cardinal'], 'TCU': ['Horned Frogs'], 'Texas': ['Longhorns', 'Horns'], 'UCLA': ['Bruins'], 'USC': ['Trojans'],
    'Utah': ['Utes'], 'Virginia Tech': ['VTech', 'Va Tech', 'VT', 'Hokies'], 'Washington': ['UW', 'Huskies'],
    'West Virginia': ['WVU', 'Mountaineers']
  };
  const durSec = d => { const g = k => +((d || '').match(new RegExp('(\\d+)' + k)) || [0, 0])[1]; return g('h') * 3600 + g('m') * 60 + g('s'); };
  const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let MENTIONS = () => new Set();
  const teamOf = name => Object.values(members).find(m => m.school.toLowerCase() === String(name).toLowerCase());
  const confOf = m => (L.conferences || []).find(c => c.schools.some(s => s.toLowerCase() === m.school.toLowerCase()));
  const weekGames = (season, week) => ((L.schedule || []).find(s => s.season === season && s.week === week) || {}).games || [];
  function pickStream(m, oppName, season, week) {
    const opp = teamOf(oppName);
    const oppRe = new RegExp('(^|[^A-Za-z])' + reEsc(oppName) + '(?![A-Za-z])', 'i');
    const hits = v => opp ? MENTIONS(v.title).has(opp.login) : oppRe.test(v.title);
    // a stream that clearly belongs to a different game (its title names another member's school, or it was
    // pulled in by another opponent's stream) is never credited to this matchup
    const otherGame = v => {
      const men = MENTIONS(v.title); men.delete(m.login);
      if ([...men].some(l => !opp || l !== opp.login)) return true;
      const by = v.rescuedBy && D.videos.find(x => x.id === v.rescuedBy);
      return !!(by && (!opp || by.login !== opp.login));
    };
    const same = D.videos.filter(v => v.login === m.login && v.season === season && v.week === week);
    return same.find(hits) || D.videos.find(v => v.login === m.login && v.season === season && v.week != null && Math.abs(v.week - week) === 1 && hits(v)) || same.find(v => !otherGame(v)) || null;
  }
  function pairUp() {
    const after = '(?![A-Za-z])(?!\\s+(?:State|St\\.?|Tech|A&M|Christian|Southern|Atlantic|International)\\b)';
    const names = [];
    for (const m of Object.values(members)) {
      const list = [m.school, ...(m.abbr && m.abbr.length >= 3 && m.abbr !== 'OSU' ? [m.abbr] : []), ...(ALIASES[m.school] || []), ...(m.aliases || [])];
      for (const n of list) if (n) names.push([n, m.login]);
    }
    names.sort((a, b) => b[0].length - a[0].length);
    const matchers = names.map(([n, login]) => [new RegExp('(^|[^A-Za-z])' + reEsc(n) + after, 'i'), login]);
    const mentions = title => { let t = ' ' + title + ' '; const f = new Set(); for (const [re, login] of matchers) if (re.test(t)) { f.add(login); t = t.replace(re, '$1 '); } return f; };
    const slack = 30 * 60e3;
    const vs = D.videos.map(v => ({ v, s: Date.parse(v.created), e: Date.parse(v.created) + durSec(v.duration) * 1000, men: mentions(v.title) }));
    MENTIONS = mentions;
    for (const x of vs) x.v.sides = [];
    for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) {
      const a = vs[i], b = vs[j];
      if (a.v.login === b.v.login) continue;
      if (!(a.s < b.e + slack && b.s < a.e + slack)) continue;
      if (a.men.has(b.v.login) || b.men.has(a.v.login)) { a.v.sides.push(b.v.id); b.v.sides.push(a.v.id); }
    }
    for (const sch of (L.schedule || [])) for (const [aw, hm] of sch.games) {
      const a = teamOf(aw), h = teamOf(hm);
      if (!a || !h) continue;
      const va = pickStream(a, hm, sch.season, sch.week), vh = pickStream(h, aw, sch.season, sch.week);
      if (va && vh && !va.sides.includes(vh.id) && Math.abs(Date.parse(va.created) - Date.parse(vh.created)) <= 45 * 60e3) { va.sides.push(vh.id); vh.sides.push(va.id); }
    }
  }
  function teamCell(name, opp, season, week) {
    const m = teamOf(name);
    if (!m) return `<div class="tm"><span class="chip">CPU</span><span class="nm"><b>${esc(name)}</b><span>Computer</span></span></div>`;
    const lv = season === L.season && week === seasonWeeks()[0] && liveOf(m);
    if (lv) return `<a class="tm on" href="#live-${esc(m.login)}" title="${esc(lv.title)}">${avatar(m)}<span class="nm"><b>${esc(m.school)}</b><span>${esc(m.display)}</span></span><span class="pill-live">LIVE</span></a>`;
    const v = pickStream(m, opp, season, week);
    return `<a class="tm" href="${v ? '#v-' + esc(v.id) : '#ch-' + slug(m.login)}">${avatar(m)}<span class="nm"><b>${esc(m.school)}</b><span>${esc(m.display)}</span></span>${v ? '<span class="play">▶<span class="w"> Watch</span></span>' : '<span class="nos">No stream</span>'}</a>`;
  }
  // rivalries in league.json: [{ teams: [a, b], name }], matched either way round, any week
  function rivalryOf(a, b) {
    const k = x => String(x).toLowerCase();
    return (L.rivalries || []).find(r => r.teams && r.teams.length === 2 && ((k(r.teams[0]) === k(a) && k(r.teams[1]) === k(b)) || (k(r.teams[0]) === k(b) && k(r.teams[1]) === k(a)))) || null;
  }
  function matchups(season, week) {
    const games = weekGames(season, week);
    if (!games.length) return '';
    const isStar = (aw, hm) => gotwList().some(g => g.season === season && g.week === week && g.away === aw && g.home === hm);
    const nRiv = games.filter(([aw, hm]) => rivalryOf(aw, hm)).length;
    const rivBar = nRiv ? `<div class="rv-bar"><span class="rv-sum"><span class="rv-pill">Rivalry</span>${nRiv >= 8 ? '<b>Rivalry Week</b> · ' : ''}${nRiv} rivalry game${nRiv === 1 ? '' : 's'}</span><button type="button" class="rv-filter" aria-pressed="false" onclick="const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);this.parentElement.nextElementSibling.classList.toggle('only-rival',on)">Rivalries only</button></div>` : '';
    const sch = (L.schedule || []).find(s => s.season === season && s.week === week) || {};
    const champ = (aw, hm) => { if (!sch.championship) return ''; const a = teamOf(aw), h = teamOf(hm), ca = a && confOf(a), ch = h && confOf(h); return ca && ca === ch ? `Tier ${ca.tier} Championship` : 'Championship'; };
    const row = ([aw, hm]) => {
      const st = isStar(aw, hm), rv = rivalryOf(aw, hm), ct = champ(aw, hm);
      const tags = st || rv || ct ? `<div class="tags">${ct ? `<span class="ct">${esc(ct)}</span>` : ''}${st ? '<span class="gw">★ Game of the Week</span>' : ''}${rv ? `<span class="rv"><span class="rv-pill">Rivalry</span>${rv.name ? esc(rv.name) : ''}</span>` : ''}</div>` : '';
      return `<div class="game${st ? ' star' : ''}${rv ? ' rival' : ''}">${tags}${teamCell(aw, hm, season, week)}<span class="at">@</span>${teamCell(hm, aw, season, week)}${bothLink(aw, hm, season, week)}</div>`;
    };
    return `<h2 class="section-h">Matchups</h2>${rivBar}<div class="mu-list">${games.map(row).join('')}</div><h2 class="section-h">All streams</h2>`;
  }
  function bothPair(aw, hm, season, week) {
    const a = teamOf(aw), h = teamOf(hm);
    if (!a || !h) return null;
    const va = pickStream(a, hm, season, week), vh = pickStream(h, aw, season, week);
    return va && vh && (va.sides || []).includes(vh.id) ? [va, vh] : null;
  }
  function bothLink(aw, hm, season, week) {
    const la = teamOf(aw), lh = teamOf(hm);
    if (la && lh && season === L.season && week === seasonWeeks()[0] && liveOf(la) && liveOf(lh))
      return `<a class="both-link live" href="#both-c${esc(la.login)}-c${esc(lh.login)}"><span class="pill-live">LIVE</span> Watch both sidelines</a>`;
    const p = bothPair(aw, hm, season, week);
    return p ? `<a class="both-link" href="#both-v${esc(p[0].id)}-v${esc(p[1].id)}">▶▶ Watch both sidelines</a>` : '';
  }
  let gotwTimer = null;
  // Game of the Week: gameOfWeek (set by the admin app) plus optional gameOfWeekExtra [] for weeks that feature more than one game
  const gotwList = () => [L.gameOfWeek, ...(Array.isArray(L.gameOfWeekExtra) ? L.gameOfWeekExtra : [])].filter(Boolean);
  function gotw(season, week) {
    return gotwList().filter(g => g.season === season && g.week === week).map(g => gotwCard(g, season, week)).join('');
  }
  function gotwCard(g, season, week) {
    const a = teamOf(g.away), h = teamOf(g.home);
    const ko = g.kickoff ? Date.parse(g.kickoff) : NaN, now = Date.now(), tba = isNaN(ko);
    const tz = g.tzLabel || 'ET', tzName = g.tz || 'America/New_York';
    const fmt = (opts, zone) => new Date(ko).toLocaleString('en-US', { ...opts, timeZone: zone });
    const homeTime = fmt({ hour: 'numeric', minute: '2-digit' }, tzName) + ' ' + tz;
    const day = fmt({ weekday: 'short', month: 'short', day: 'numeric' }, tzName);
    const mine = new Date(ko).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
    const sameZone = Intl.DateTimeFormat().resolvedOptions().timeZone === tzName;
    const side = (m, name) => m ? `<div class="side">${avatar(m)}<b>${esc(m.school)}</b><span>${esc(m.display)}</span></div>`
      : `<div class="side"><span class="av" style="--sc:#333;--ink:#fff">CPU</span><b>${esc(name)}</b><span>Computer</span></div>`;
    const isLive = m => m && (D.live || []).some(x => x.login.toLowerCase() === m.login);
    let windowLive = now >= ko - 15 * 60e3 && now < ko + 2.5 * 3600e3;
    const va = a && pickStream(a, g.home, season, week), vh = h && pickStream(h, g.away, season, week);
    // Game is over once both coaches are offline and both saved streams from around kickoff are in
    const near = v => v && Math.abs(Date.parse(v.created) - ko) < 2 * 3600e3;
    const ended = near(va) && near(vh) && !isLive(a) && !isLive(h);
    const done = now >= ko + 2.5 * 3600e3 || ended;
    if (ended) windowLive = false;
    let acts = '';
    for (const [m, v] of [[a, va], [h, vh]]) {
      if (!m) continue;
      if (isLive(m) || windowLive) acts += `<a class="hot" href="https://www.twitch.tv/${esc(m.login)}" target="_blank" rel="noopener">${isLive(m) ? '<span class="pill-live">LIVE</span>' : '▶'} ${esc(m.school)} side on Twitch</a>`;
      else if (done && v) acts += `<a class="hot" href="#v-${esc(v.id)}">▶ Replay: ${esc(m.school)} side</a>`;
      else acts += `<a href="https://www.twitch.tv/${esc(m.login)}" target="_blank" rel="noopener">${esc(m.display)} on Twitch</a>`;
    }
    if (a && h && (windowLive || (isLive(a) && isLive(h)))) acts = `<a class="hot" href="#both-c${esc(a.login)}-c${esc(h.login)}">▶▶ Watch both sidelines live</a>` + acts;
    else if (done && bothPair(g.away, g.home, season, week)) { const p = bothPair(g.away, g.home, season, week); acts = `<a class="hot" href="#both-v${esc(p[0].id)}-v${esc(p[1].id)}">▶▶ Watch both sidelines</a>` + acts; }
    const sc = (m, k) => m ? `--${k}:${m.color}` : `--${k}:#333`;
    const poster = g.poster ? `<a class="gw-poster" href="${esc(g.poster)}" target="_blank" rel="noopener"><img src="${esc(g.poster)}" alt="${esc(g.posterAlt || (g.away + ' vs ' + g.home))}" loading="eager"></a>` : '';
    return poster + `<section class="gotw" style="${sc(a, 'ca')};${sc(h, 'ch')}" aria-label="Game of the Week" data-ko="${ko}"${done ? ' data-done="1"' : ''}>
      <div class="top"><span class="gw-tag">★ Game of the Week</span><span class="when">${tba ? 'Kickoff TBA' : `${esc(day)} · ${esc(homeTime)}${sameZone ? '' : `<small>${esc(mine)} your time</small>`}`}</span></div>
      <div class="row">${side(a, g.away)}<span class="vs">${g.neutral ? 'vs' : '@'}</span>${side(h, g.home)}</div>
      <div class="clock" data-clock></div>
      <div class="acts">${acts}</div></section>`;
  }
  function tickGotw() {
    const els = document.querySelectorAll('.gotw [data-clock]');
    if (!els.length) { clearInterval(gotwTimer); gotwTimer = null; return; }
    els.forEach(tickOne);
  }
  function tickOne(el) {
    const ko = +el.closest('.gotw').dataset.ko, d = ko - Date.now(), over = el.closest('.gotw').dataset.done;
    if (isNaN(ko)) { el.innerHTML = `Kickoff time <span class="n">TBA</span>`; return; }
    if (d > 0 && !over) {
      const hh = Math.floor(d / 3600e3), mm = Math.floor(d % 3600e3 / 60e3), dd = Math.floor(hh / 24);
      el.innerHTML = `Kickoff in <span class="n">${dd ? dd + 'd ' + (hh % 24) + 'h' : hh ? hh + 'h ' + mm + 'm' : mm + 'm'}</span>`;
    } else if (d > -2.5 * 3600e3 && !over) el.innerHTML = `<span class="n">Game on</span> · watch it live below`;
    else el.innerHTML = `<span class="n">Final</span>${el.closest('.gotw').querySelector('.acts a[href^="#v-"]') ? ' · replays below' : ''}`;
  }
  const grid = (list, showWeek) => `<div class="grid">${list.map(v => card(v, showWeek)).join('')}</div>`;

  const liveOf = m => m && (D.live || []).find(x => x.login.toLowerCase() === m.login);
  function liveStrip() {
    if (!D.live || !D.live.length) return '';
    return `<div class="live" aria-label="Live now">${D.live.map(s => {
      const m = member(s.login.toLowerCase());
      return `<a href="#live-${esc(m.login)}">${avatar(m)}<span class="txt"><b><span class="pill-live">LIVE</span> ${esc(m.display)}</b><span>${esc(s.title)}</span></span></a>`;
    }).join('')}</div>`;
  }
  // Realistic video banners (ComfyUI, MiniMax H3) for the Weeks page and Channels page.
  function vbHero(id, src, pre, title, sub, pos) {
    return `<section class="vb-hero" id="${id}" style="--vb-pos:${pos}" aria-hidden="true"><video src="${src}" muted loop playsinline preload="auto"></video><div class="vb-txt"><div class="pre">${pre}</div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div></section>`;
  }
  function startVbHero(id) {
    const box = document.getElementById(id); if (!box) return;
    const v = box.querySelector('video'); const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    v.muted = true; v.onerror = () => box.remove();
    v.addEventListener('loadeddata', () => { if (!v.isConnected) return; box.classList.add('has-vid');
      if (still) v.currentTime = 1.2; else { const p = v.play(); if (p) p.catch(() => {}); } }, { once: true });
  }

  function banner() {
    let h = '';
    if (D.sample) h += `<div class="banner"><strong>Preview with sample videos.</strong> These cards are placeholders. Once Twitch is connected, real streams from all ${L.members.length} members fill in automatically and play right on this page.</div>`;
    return h;
  }

  const seasonWeeks = () => (L.weeks || []).filter(w => w.season === L.season).map(w => w.week).sort((a, b) => b - a);
  const inWeek = (v, wk) => wk === null ? !(v.season === L.season && seasonWeeks().includes(v.week)) : v.season === L.season && v.week === wk;

  function defaultWeek() {
    for (const w of seasonWeeks()) if (D.videos.some(v => inWeek(v, w)) || (L.schedule || []).some(g => g.season === L.season && g.week === w)) return w;
    return seasonWeeks()[0] ?? null;
  }

  function viewWeek(wk) {
    const weeks = seasonWeeks();
    const list = D.videos.filter(v => inWeek(v, wk));
    const unsorted = D.videos.filter(v => inWeek(v, null)).length;
    const chips = weeks.map(w => {
      const n = D.videos.filter(v => inWeek(v, w)).length;
      const e = L.weeks.find(x => x.season === L.season && x.week === w);
      return `<a href="#week-${w}" class="${n ? '' : 'empty'}" ${w === wk ? 'aria-current="page"' : ''}><small>${e && (e.chip || e.label) ? esc(e.chip || e.label) : 'Week'}</small><b>${e && e.label && !e.chip ? '' : w}</b><i>${n}</i></a>`;
    }).join('') + (unsorted ? `<a href="#unsorted" ${wk === null ? 'aria-current="page"' : ''}><small>Other</small><b>…</b><i>${unsorted}</i></a>` : '');
    const start = (L.weeks || []).find(x => x.season === L.season && x.week === wk);
    app.innerHTML = `${banner()}${liveStrip()}${vbHero('vb-home', 'vid/home-banner.mp4', `Blam League · Season ${esc(L.season)}`, 'Game<span>day</span>', 'Every game. Every sideline.', '50% 35%')}
      <div class="weekhead"><div><h1>${esc(weekLabel(L.season, wk))}</h1>
        <p>Season ${L.season}${start ? ' · advanced ' + esc(fmtDate(start.start)) : ''}</p></div>
        <span class="count">${list.length} stream${list.length === 1 ? '' : 's'}</span></div>
      <nav class="sched" aria-label="Weeks">${chips}</nav>
      ${wk !== null ? playoffLink(wk) + gotw(L.season, wk) + matchups(L.season, wk) : ''}
      ${list.length ? grid(list, wk === null) : `<div class="empty-state"><b>No tape yet</b>Nobody's stream from ${esc(weekLabel(L.season, wk))} is on Twitch. New streams show up within about 2 hours.</div>`}`;
    startVbHero('vb-home');
    if (app.querySelector('.gotw')) { tickGotw(); if (!gotwTimer) gotwTimer = setInterval(tickGotw, 30e3); }
    const cur = app.querySelector('.sched [aria-current]');
    if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  // Playoff bracket from league.json "playoff": seeds [{seed, school, record, aq}] and games
  // [{id, round 1-4, top, bot, winner?, score? [top, bot], week?, name?}]; top/bot = a seed number or the id of the game whose winner fills it
  function playoffLink(wk) {
    const P = L.playoff;
    if (!P || P.season !== L.season || wk < (P.fromWeek || 0)) return '';
    return `<a class="pf-link" href="#playoff"><span class="k">${esc(P.title || 'Playoff')}</span><b>View the ${(P.seeds || []).length}-team bracket</b><span>${P.site ? 'Title game · ' + esc(P.site) + ' →' : '→'}</span></a>`;
  }
  function viewPlayoff() {
    const P = L.playoff;
    if (!P) { viewWeek(defaultWeek()); return; }
    const G = P.games || [], byId = Object.fromEntries(G.map(g => [g.id, g]));
    const seedOf = n => (P.seeds || []).find(s => s.seed === n);
    const fill = slot => typeof slot === 'number' ? slot : (byId[slot] && byId[slot].winner) || null;
    const RN = { 1: 'First round', 2: 'Quarterfinals', 3: 'Semifinals', 4: 'National Championship' };
    const tbd = slot => { const g = byId[slot]; if (!g) return 'TBD'; return typeof g.top === 'number' && typeof g.bot === 'number' ? `Winner of #${g.top} / #${g.bot}` : `${RN[g.round] ? RN[g.round].replace(/s$/, '') : 'Game'} winner`; };
    const icon = s => { const m = teamOf(s.school); return m ? avatar(m) : `<span class="av" style="--sc:#333;--ink:#fff">${esc(s.school.slice(0, 3).toUpperCase())}</span>`; };
    const side = (g, k) => {
      const n = fill(g[k]), s = n && seedOf(n);
      if (!s) return `<div class="pf-tm tbd"><em></em><span class="pf-nm">${esc(tbd(g[k]))}</span></div>`;
      const sc = g.score ? g.score[k === 'top' ? 0 : 1] : null;
      return `<div class="pf-tm${g.winner ? (g.winner === n ? ' win' : ' out') : ''}"><em>${n}</em>${icon(s)}<span class="pf-nm"><b>${esc(s.school)}${s.aq ? '<sup>*</sup>' : ''}</b><small>${esc(s.record || '')}</small></span>${sc != null ? `<span class="pf-sc">${esc(sc)}</span>` : ''}</div>`;
    };
    const game = g => {
      const a = seedOf(fill(g.top)), b = seedOf(fill(g.bot));
      const link = g.week && a && b ? bothLink(a.school, b.school, P.season, g.week) : '';
      const nm = g.name || (g.round === 4 && P.site ? `${P.site}${P.venue ? ' · ' + P.venue : ''}` : '');
      return `<div class="pf-g">${nm ? `<div class="pf-gn">${esc(nm)}</div>` : ''}${side(g, 'top')}${side(g, 'bot')}${link}</div>`;
    };
    const rounds = [1, 2, 3, 4].map(r => ({ r, list: G.filter(g => g.round === r) })).filter(x => x.list.length);
    const nc = G.find(g => g.round === 4), champ = nc && nc.winner && seedOf(nc.winner);
    const champWk = (L.schedule || []).find(s => s.season === P.season && s.championship);
    app.innerHTML = `${liveStrip()}<section class="pf-hero"><small>Blam League · Season ${esc(P.season)}</small><h1>${esc(P.title || 'Playoff')}</h1>
        <p>${(P.seeds || []).length} teams${P.site ? ` · National Championship in ${esc(P.site)}${P.venue ? ', ' + esc(P.venue) : ''}` : ''}</p>
        ${champ ? `<div class="champ">${icon(champ)}National champion: ${esc(champ.school)}</div>` : ''}</section>
      <div class="pf-sub"><span>Top 4 seeds get a first-round bye.</span>${champWk ? `<a href="#week-${champWk.week}">Conference championships →</a>` : ''}</div>
      <div class="pf-scroll"><div class="pf">${rounds.map(x => `<div class="pf-col"><div class="pf-rh">${RN[x.r]}</div><div class="pf-games">${x.list.map(game).join('')}</div></div>`).join('')}</div></div>
      <p class="pf-key"><b style="color:var(--accent)">*</b> = automatic qualifier (conference champion)</p>`;
  }

  function viewChannels() {
    const all = Object.values(members).sort((a, b) => a.school.localeCompare(b.school));
    const groups = (L.conferences || []).slice().sort((a, b) => a.tier - b.tier)
      .map(c => ({ title: `Tier ${c.tier} · ${c.name}`, list: all.filter(m => confOf(m) === c) })).filter(g => g.list.length);
    const rest = all.filter(m => !confOf(m));
    if (rest.length) groups.push({ title: groups.length ? 'Other' : '', list: rest });
    const tile = m => profilesOn() ? `
        <div class="ch pro${liveOf(m) ? ' on' : ''}" style="${scVars(m)}" data-q="${esc((m.display + ' ' + m.school + ' ' + m.abbr).toLowerCase())}">
          ${avatar(m, 'md')}<span class="txt"><a class="cname" href="#coach-${slug(m.login)}" title="${esc(m.display)}'s coach profile"><b>${esc(m.display)}</b></a>${liveOf(m) ? '<span class="pill-live">LIVE</span>' : ''}
          <a class="ch-go" href="#ch-${slug(m.login)}" aria-label="${esc(m.display)} videos"><span>${esc(m.school)}</span>
          <span class="n">${m.count} video${m.count === 1 ? '' : 's'}</span></a></span></div>` : `
        <a class="ch${liveOf(m) ? ' on' : ''}" href="#ch-${slug(m.login)}" style="${scVars(m)}" data-q="${esc((m.display + ' ' + m.school + ' ' + m.abbr).toLowerCase())}">
          ${avatar(m, 'md')}<span class="txt"><b>${esc(m.display)}${liveOf(m) ? '<span class="pill-live">LIVE</span>' : ''}</b><span>${esc(m.school)}</span>
          <span class="n">${m.count} video${m.count === 1 ? '' : 's'}</span></span></a>`;
    app.innerHTML = `${banner()}${liveStrip()}${vbHero('vb-coach', 'vid/coach-banner.mp4', 'Blam League', 'The <span>Coaches</span>', `${L.members.length} channels. Every stream, every sideline.`, '70% 35%')}
      <div class="toolbar"><h1>Channels</h1>
        <input class="search" id="ch-filter" type="search" placeholder="Search coach or school" aria-label="Search coach or school"></div>
      ${groups.map(g => `<section class="conf">${g.title ? `<h2 class="section-h">${esc(g.title)}</h2>` : ''}<div class="chgrid">${g.list.map(tile).join('')}</div></section>`).join('')}`;
    startVbHero('vb-coach');
    const f = document.getElementById('ch-filter');
    f.addEventListener('input', () => {
      const q = f.value.trim().toLowerCase();
      document.querySelectorAll('.conf').forEach(sec => {
        let shown = 0;
        sec.querySelectorAll('.ch').forEach(el => { el.hidden = q && !el.dataset.q.includes(q); if (!el.hidden) shown++; });
        sec.hidden = !shown;
      });
    });
  }
  // Coach intro video: league.json member "intro": { "url": "vid/x.mp4", "poster": "vid/x.jpg", "title": "..." }
  function introBlock(m) {
    const it = m && m.intro; if (!it || !it.url) return '';
    return `<section class="ch-intro"><video src="${esc(it.url)}"${it.poster ? ` poster="${esc(it.poster)}"` : ''} controls playsinline preload="metadata"></video><div class="cap"><span>Coach intro</span>${esc(it.title || '')}</div></section>`;
  }
  function viewChannel(s) {
    const m = bySlug[s];
    if (!m) { app.innerHTML = `<div class="empty-state"><b>Channel not found</b>That coach isn't on the Blam League list. <a href="#channels">See all channels</a></div>`; return; }
    const list = D.videos.filter(v => v.login === m.login);
    const groups = [];
    for (const v of list) {
      const key = v.week == null ? 'Other' : (v.season !== L.season ? `Season ${v.season} · ` : '') + weekLabel(v.season, v.week);
      let g = groups.find(x => x.key === key); if (!g) groups.push(g = { key, items: [] }); g.items.push(v);
    }
    const isLive = (D.live || []).some(x => x.login.toLowerCase() === m.login);
    app.innerHTML = `${banner()}
      <section class="chan" style="${scVars(m)}"><div class="band" data-abbr="${esc(m.abbr)}"></div>
        <div class="body">${avatar(m, 'lg')}<div class="txt"><h1>${esc(m.display)}</h1>
          <p>${esc(m.school)}${confOf(m) ? ' · ' + esc(confOf(m).name) : ''} · Season ${L.season} · ${list.length} video${list.length === 1 ? '' : 's'}${isLive ? ' · <span class="pill-live">LIVE</span>' : ''}</p></div>
          ${profilesOn() ? `<a class="btn primary" href="#coach-${slug(m.login)}">Coach profile</a>` : ''}<a class="btn" href="https://www.twitch.tv/${esc(m.login)}" target="_blank" rel="noopener">Open on Twitch ↗</a></div></section>
      ${introBlock(m)}${groups.length ? groups.map(g => `<h2 class="section-h">${esc(g.key)}</h2>${grid(g.items, false)}`).join('')
        : `<div class="empty-state"><b>No saved streams</b>${esc(m.display)} has no past broadcasts on Twitch right now. In Twitch settings, they can turn on <em>Store past broadcasts</em> so games get saved.</div>`}`;
  }

  function otherSide(v) {
    const list = (v.sides || []).map(id => D.videos.find(x => x.id === id)).filter(Boolean);
    if (!list.length) return '';
    return `<section class="other"><h2>Watch from the other sideline</h2>${list.map(x => { const mm = member(x.login); return `<a href="#v-${esc(x.id)}">${avatar(mm)}<span class="t"><b>${esc(mm.display)} · ${esc(mm.school)}</b><span class="s">${esc(x.title)}</span></span><span class="go">Switch ⇄</span></a>
      <a class="bothbtn" href="#both-v${esc(v.id)}-v${esc(x.id)}">▶▶ Watch both sidelines at once</a>`; }).join('')}</section>`;
  }

  // ---- Both sidelines: two players side by side, one audio, synced replays ----
  let bothStop = null, twitchApi = null;
  const loadTwitchApi = () => twitchApi || (twitchApi = new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = 'https://player.twitch.tv/js/embed/v1.js';
    s.onload = () => ok(window.Twitch); s.onerror = bad; document.head.appendChild(s);
  }));
  function viewBoth(ka, kb) {
    const parse = k => k[0] === 'v' ? (v => v && { kind: 'video', v, m: member(v.login) })(D.videos.find(x => x.id === k.slice(1)))
      : k[0] === 'c' ? (m => ({ kind: 'live', m }))(member(k.slice(1))) : null;
    const A = parse(ka), B = parse(kb);
    if (!A || !B) { app.innerHTML = `<div class="empty-state"><b>Stream not found</b>One of these videos may have been deleted from Twitch. <a href="#">Back to this week</a></div>`; return; }
    const live = A.kind === 'live';
    const host = location.hostname, preview = D.sample || !host;
    const panel = (S, i) => `<section class="bside" style="${scVars(S.m)}">
        <div class="pl" id="bp${i}">${preview ? `<div class="ph" style="${scVars(S.m)}"><span class="ph-abbr">${esc(S.m.abbr)}</span></div>` : ''}</div>
        <div class="bar">${avatar(S.m)}<span class="t"><b>${esc(S.m.school || S.m.display)}</b><span class="s">${esc(S.m.display)}${S.v ? ' · ' + esc(S.v.title) : ' · live on Twitch'}</span></span>
          <button class="snd" data-i="${i}" aria-pressed="false">🔈 Hear this side</button></div></section>`;
    const wk = A.v && A.v.week != null ? `<a class="btn" href="#week-${A.v.week}">${esc(weekLabel(A.v.season, A.v.week))}</a>` : '';
    app.innerHTML = `<div class="both-head"><div><h1>${esc(A.m.school || A.m.display)} <span style="color:var(--accent)">⇄</span> ${esc(B.m.school || B.m.display)}</h1>
        <p>${live ? 'Both sidelines, live' : 'Both sidelines of the same game'} · tap a side to hear its commentary</p></div>
        <div class="both-tools">${live ? '' : '<button id="bsync" disabled>⟳ Sync to same moment</button>'}${wk}</div></div>
      <div class="both-grid">${panel(A, 0)}${panel(B, 1)}</div>
      ${live ? chatBox([A.m, B.m], 'both-chat') : ''}
      <p class="both-note">${live ? 'Each side plays live from Twitch.' : 'Replays start lined up to the same moment of the game. If one side pauses or skips, hit Sync to line them back up.'} Both start muted so they can autoplay. Tap "Hear this side" to turn on that side's sound.</p>`;
    if (preview) return;
    let gone = false; bothStop = () => { gone = true; };
    loadTwitchApi().then(Tw => {
      if (gone) return;
      const S = [A, B], P = [], ready = [false, false];
      S.forEach((s, i) => {
        const opts = { width: '100%', height: '100%', parent: [host], autoplay: true, muted: true };
        if (s.kind === 'video') opts.video = s.v.id; else opts.channel = s.m.login;
        P[i] = new Tw.Player('bp' + i, opts);
        P[i].addEventListener(Tw.Player.READY, () => { ready[i] = true; if (ready[0] && ready[1]) onBothReady(); });
      });
      const t0 = i => Date.parse(S[i].v.created) / 1000;
      const sync = () => {
        if (live) return;
        const real = t0(0) + (P[0].getCurrentTime() || 0);
        let pos1 = real - t0(1);
        if (pos1 < 0) { P[0].seek(t0(1) - t0(0)); pos1 = 0; }
        P[1].seek(pos1); P[0].play(); P[1].play();
      };
      let synced = false;
      const onBothReady = () => {
        const btn = document.getElementById('bsync');
        if (btn) { btn.disabled = false; btn.onclick = sync; }
        if (!live && !synced) { synced = true; setTimeout(sync, 1500); }
      };
      app.querySelectorAll('.bside .snd').forEach(b => b.onclick = () => {
        const on = +b.dataset.i;
        P.forEach((p, i) => p.setMuted(i !== on)); P[on].play();
        app.querySelectorAll('.bside .snd').forEach(x => { const me = +x.dataset.i === on; x.setAttribute('aria-pressed', me); x.textContent = me ? '🔊 Hearing this side' : '🔈 Hear this side'; });
      });
    }).catch(() => { if (!gone) app.querySelector('.both-note').textContent = 'The Twitch player could not load. Try refreshing the page.'; });
  }

  function viewWatch(id) {
    const v = D.videos.find(x => String(x.id) === id);
    if (!v) { app.innerHTML = `<div class="empty-state"><b>Video gone</b>Twitch may have deleted this stream. <a href="#">Back to this week</a></div>`; return; }
    const m = member(v.login);
    const host = location.hostname;
    const player = D.sample || !host
      ? `<div class="ph" style="${scVars(m)}"><span class="ph-wk">${esc(weekShort(v))}</span><span class="ph-abbr">${esc(m.abbr)}</span></div><span class="note">On the live site, the Twitch stream plays here</span>`
      : `<iframe src="https://player.twitch.tv/?video=${encodeURIComponent(v.id)}&parent=${encodeURIComponent(host)}&autoplay=true" allowfullscreen title="${esc(v.title)}"></iframe>`;
    const more = D.videos.filter(x => x.id !== v.id && x.season === v.season && x.week === v.week && v.week != null).slice(0, 12);
    const fromCoach = D.videos.filter(x => x.id !== v.id && x.login === v.login).slice(0, 6);
    const side = (more.length ? more : fromCoach);

    catch (e) { return window.btvVoter || (window.btvVoter = crypto.randomUUID()); }
  }
  function pollMine(id, val) {
    try { if (val !== undefined) localStorage.setItem('btv-poll-' + id, val); return localStorage.getItem('btv-poll-' + id); }

  async function initPoll(el) {
    const id = el.dataset.poll, foot = el.querySelector('.mg-poll-f'), closed = !!el.dataset.closed;
    const paint = rows => {
      const tot = rows.reduce((s, r) => s + Number(r.votes), 0), mine = pollMine(id), show = !!mine || closed;
      el.classList.toggle('voted', show);
      const jump = document.querySelector('.mg-poll-jump span'); if (jump) jump.textContent = show ? 'See results ↓' : 'Vote now ↓';
      for (const r of rows) {
        const btn = el.querySelector(`[data-opt="${r.option_id}"]`); if (!btn) continue;
        const pc = tot ? Math.round(Number(r.votes) * 100 / tot) : 0;
        btn.querySelector('.bar i').style.width = show ? pc + '%' : '0';
        btn.querySelector('.pct').textContent = show ? pc + '%' : '';
        btn.querySelector('.cnt').textContent = show ? `${Number(r.votes)} vote${Number(r.votes) === 1 ? '' : 's'}` : '';
        btn.classList.toggle('mine', r.option_id === mine); btn.setAttribute('aria-pressed', r.option_id === mine);
      }
      el.querySelector('.mg-poll-tot strong').textContent = tot.toLocaleString();
      el.querySelector('.mg-poll-tot span').textContent = tot === 1 ? 'vote' : 'votes';
      foot.textContent = closed ? `Final: ${tot} vote${tot === 1 ? '' : 's'} · voting is closed` : mine ? `${tot} vote${tot === 1 ? '' : 's'} · tap another player to change your vote` : `${tot} vote${tot === 1 ? '' : 's'} so far · tap a player to vote and see the results`;
    };
    try {
      const c = await supa();
      const { data, error } = await c.rpc('poll_results', { p_poll: id });
      if (error) throw error;
      paint(data || []);
      if (closed) return;
      // keep the count live while the poll is on screen
      const tick = setInterval(async () => {
        if (!el.isConnected) return clearInterval(tick);
        if (document.hidden || el.classList.contains('busy')) return;
        const r = await c.rpc('poll_results', { p_poll: id });
        if (!r.error && el.isConnected) paint(r.data || []);
      }, 20e3);
      el.querySelectorAll('button[data-opt]').forEach(btn => btn.onclick = async () => {
        if (el.classList.contains('busy')) return;
        el.classList.add('busy');
        const r = await c.rpc('cast_vote', { p_poll: id, p_option: btn.dataset.opt, p_voter: pollVoter() });
        el.classList.remove('busy');
        if (r.error) { foot.textContent = "Your vote didn't go through. Try again."; return; }
        pollMine(id, btn.dataset.opt); paint(r.data || []);
      });
    } catch (e) { foot.textContent = 'The poll is offline right now. Check back soon.'; }
  }

  // Original cartoon player high-stepping into the end zone (drawn in code; still frame for reduced motion)
  function startHighStep(canvas) {
    const ctx = canvas.getContext('2d');

      // stadium light glow
      g = ctx.createRadialGradient(W * 0.82, 0, 10, W * 0.82, 0, H * 0.9); g.addColorStop(0, 'rgba(255,235,180,.32)'); g.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // keep the copy readable: darken the left side
      g = ctx.createLinearGradient(0, 0, W * 0.6, 0); g.addColorStop(0, 'rgba(7,8,11,.82)'); g.addColorStop(1, 'rgba(7,8,11,0)');

    const head = app.querySelector('.coach-pg .chan'); if (head) head.outerHTML = coachHead(cpState.m, cpState.cp);
  });

  document.addEventListener('click', async (e) => {
    const s = e.target.closest('[data-signin]'); if (s) { e.preventDefault(); signIn(s.dataset.signin); return; }
    if (e.target.closest('[data-signout]')) { e.preventDefault(); if (sb) await sb.auth.signOut(); return; }
    const b = e.target.closest('.cmod button'); if (!b || !sb) return;
    if (!b.classList.contains('arm')) { b.classList.add('arm'); b.dataset.label = b.textContent; b.textContent = b.dataset.act === 'ban' ? 'Confirm ban' : 'Confirm'; setTimeout(() => { if (b.isConnected) { b.classList.remove('arm'); b.textContent = b.dataset.label; } }, 4000); return; }
    if (b.dataset.act === 'del') await sb.from('messages').update({ deleted: true }).eq('id', b.dataset.id);
    if (b.dataset.act === 'ban') { await sb.from('profiles').update({ banned: true }).eq('id', b.dataset.uid); b.textContent = 'Banned'; }
  });
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('.cform'); if (!f) return; e.preventDefault();
    const box = f.closest('.chatbox'), inp = f.querySelector('input[name=body]'); if (!inp || !me) return;
    const body = inp.value.trim(); if (!body) return;
    if (Date.now() - lastSend < 3000) { inp.placeholder = 'Slow down a sec…'; return; }
    lastSend = Date.now(); inp.value = '';
    const { error } = await sb.from('messages').insert({ room: box.dataset.room, user_id: me.id, body });
    if (error) { inp.value = body; inp.placeholder = 'Couldn\'t send. Try again.'; }
  });

  let lastHash = null;
  function render() {
    const h = location.hash.slice(1);
    let m;
    const isCh = h === 'channels' || h.startsWith('ch-') || h.startsWith('coach-');
    const isHl = h === 'highlights' || /^hl-\d+$/.test(h);
    const isCity = h === 'city' || h.startsWith('city-');
    if (nilStop) { nilStop(); nilStop = null; }
    if (hlStop) { hlStop(); hlStop = null; }
    if (bothStop) { bothStop(); bothStop = null; }
    if (chatSub && sb) { sb.removeChannel(chatSub); chatSub = null; }
    document.getElementById('nav-weeks').toggleAttribute('aria-current', !isCh && !isHl && !isCity && !h.startsWith('v-') && h !== 'nil' && h !== 'about' && h !== 'chat' && h !== 'mag' && !h.startsWith('mag-'));
    document.getElementById('nav-chat').toggleAttribute('aria-current', h === 'chat');
    document.getElementById('nav-city').toggleAttribute('aria-current', isCity);
    document.getElementById('nav-about').toggleAttribute('aria-current', h === 'about');
    document.getElementById('nav-mag').toggleAttribute('aria-current', h === 'mag' || h.startsWith('mag-'));
    document.getElementById('nav-nil').toggleAttribute('aria-current', h === 'nil');
    document.getElementById('nav-hl').toggleAttribute('aria-current', isHl);
    document.getElementById('nav-channels').toggleAttribute('aria-current', isCh);
    document.querySelectorAll('nav.tabs [aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
    if (h === 'nil') viewNil();
    else if (h === 'highlights') viewHighlights();
    else if (h === 'city') viewCity();
    else if (h === 'about') viewAbout();
    else if (h === 'playoff') viewPlayoff();
    else if (h === 'mag') viewMagazine();
    else if ((m = h.match(/^mag-([a-z0-9-]+)$/))) viewMagazine(m[1]);
    else if (h === 'chat' && chatOn()) viewChat();
    else if ((m = h.match(/^city-([a-z0-9_]+)$/))) viewCityStream(m[1]);
    else if ((m = h.match(/^live-([a-z0-9_]+)$/))) viewCityStream(m[1], false);
    else if ((m = h.match(/^hl-(\d+)$/))) viewHighlight(h);
    else if (h === 'channels') viewChannels();
    else if ((m = h.match(/^ch-([a-z0-9-]+)$/))) viewChannel(m[1]);
    else if ((m = h.match(/^coach-([a-z0-9-]+)$/)) && profilesOn()) viewCoach(m[1]);
    else if ((m = h.match(/^v-(\d+)$/))) viewWatch(m[1]);
    else if ((m = h.match(/^both-(v\d+|c[a-z0-9_]+)-(v\d+|c[a-z0-9_]+)$/))) viewBoth(m[1], m[2]);
    else if ((m = h.match(/^week-(\d+)$/))) viewWeek(+m[1]);
    else if (h === 'unsorted') viewWeek(null);
    else viewWeek(defaultWeek());
    if (lastHash !== null && lastHash !== h) window.scrollTo(0, 0);
    lastHash = h;
    countPlay(h);
    if (commentsOn()) { const slot = app.querySelector('.comments-slot'); if (slot) mountRoom(slot, slot.dataset.room, { title: 'Comments', compact: true }); }
  }

  async function init() {
    try { L = await getJSON('data/league.json'); }
    catch (e) { app.innerHTML = `<div class="empty-state"><b>Setup file missing</b>The site couldn't load data/league.json.</div>`; return; }
    try { D = await getJSON('data/videos.json'); } catch (e) { D = {}; }
    D.videos = D.videos || []; D.live = D.live || []; D.members = D.members || {};
    // Only BLAM-titled streams count as league live (banner, matchups, LIVE tags); the rest go to BlamCity
    const must = (L.titleMustIncludeAny || []).map(s => String(s).toLowerCase()).filter(Boolean);
    const isBlam = t => !must.length || must.some(k => String(t || '').toLowerCase().includes(k));
    // Same rescue rule as the updater: an untitled live stream counts if another coach's BLAM live title names this coach's school and they went live within 30 min
    const rEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), rAfter = '(?![A-Za-z])(?!\\s+(?:State|St\\.?|Tech|A&M|Christian|Southern|Atlantic|International)\\b)';
    const liveRe = {}; for (const m of L.members || []) { const n = [m.school, ...(m.abbr && m.abbr.length >= 3 && m.abbr !== 'OSU' ? [m.abbr] : []), ...(m.aliases || [])]; liveRe[m.twitch.toLowerCase()] = new RegExp('(^|[^A-Za-z])(?:' + n.map(rEsc).join('|') + ')' + rAfter, 'i'); }
    const blamLive = D.live.filter(s => isBlam(s.title));
    const liveOk = s => isBlam(s.title) || blamLive.some(w => { const re = liveRe[s.login.toLowerCase()]; return re && w.login.toLowerCase() !== s.login.toLowerCase() && re.test(' ' + w.title + ' ') && Math.abs(Date.parse(w.started) - Date.parse(s.started)) <= 30 * 60e3; });
    // ...or if this week's schedule pairs the coach with a member who went live with BLAM within 30 min (untitled stream, opponent's title doesn't name the school)
    const schoolOf = l => ((L.members.find(m => m.twitch.toLowerCase() === String(l).toLowerCase()) || {}).school || '').toLowerCase();
    const curGames = weekGames(L.season, seasonWeeks()[0]);
    const paired = s => {
      const sc = schoolOf(s.login), g = sc && curGames.find(([a, h]) => a.toLowerCase() === sc || h.toLowerCase() === sc);
      if (!g) return false;
      const opp = (g[0].toLowerCase() === sc ? g[1] : g[0]).toLowerCase();
      return blamLive.some(b => schoolOf(b.login) === opp && Math.abs(Date.parse(b.started) - Date.parse(s.started)) <= 30 * 60e3);
    };
    D.cityLive = D.live.filter(s => !liveOk(s) && !paired(s)); D.live = D.live.filter(s => liveOk(s) || paired(s));
    const cityTab = document.getElementById('nav-city');
    if (cityTab && D.cityLive.length) { cityTab.classList.add('hot'); cityTab.title = `${D.cityLive.length} live in BlamCity`; cityTab.insertAdjacentHTML('beforeend', '<span class="streetz">StreetzActive</span>'); }
    for (const mm of L.members) {
      const k = mm.twitch.toLowerCase(), info = D.members[k] || {};
      members[k] = { ...mm, login: k, display: info.display || mm.twitch, avatar: mm.logo || info.avatar || null, ink: inkFor(mm.color), count: 0 };
      bySlug[slug(k)] = members[k];
    }
    for (const v of D.videos) v.login = String(v.login).toLowerCase(), members[v.login] && members[v.login].count++;
    pairUp();
    document.getElementById('season-tag').textContent = `${L.name} · Season ${L.season}`;
    document.getElementById('foot-league').textContent = `${L.name} · ${L.game} dynasty · ${L.members.length} coaches`;
    document.getElementById('foot-updated').textContent = D.updated ? `Updated ${ago(D.updated)}` : (D.sample ? 'Sample data' : 'Waiting for first Twitch update');
    if (chatOn()) document.getElementById('nav-chat').hidden = false;
    if (/[?&]code=/.test(location.search)) {
      try { await supa(); const back = sessionStorage.getItem('btv-return') || '#chat'; history.replaceState(null, '', location.pathname + back); } catch (e) { console.error('sign-in return failed', e); }
    }
    render();
    startStats();
    addEventListener('hashchange', render);
  }
  init();
})();
</script>
