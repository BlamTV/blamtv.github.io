name: Update Blam League videos

on:
  schedule:
    - cron: '2-59/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]          # runs right away when you edit league.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull videos from Twitch
        run: node scripts/fetch-vods.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Save video list
        run: |
          git config user.name "blamtv-bot"
          git config user.email "blamtv-bot@users.noreply.github.com"
          git add data/videos.json
          # two runs can overlap; a lost race just skips saving history (the site still deploys below)
          if ! git diff --cached --quiet; then git commit -m "Update videos" && (git push || echo "push skipped: another run saved first"); fi

      - name: Prepare site
        run: mkdir _site && cp -r index.html data img vid _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
